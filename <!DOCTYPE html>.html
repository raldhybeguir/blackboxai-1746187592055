<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #333;
            color: #fff;
            position: fixed;
            padding: 20px;
        }
        .sidebar h2 {
            text-align: center;
        }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: #575757;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .header h1 {
            margin: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #333;
            color: #fff;
        }
        tr:hover {
            background: #f1f1f1;
        }
        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-edit {
            background: #4CAF50;
            color: white;
        }
        .btn-delete {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="#">Dashboard</a>
    <a href="#">Users</a>
    <a href="#">Settings</a>
    <a href="#">Logout</a>
</div>

<div class="content">
    <div class="header">
        <h1>Dashboard</h1>
        <div>Welcome, Admin</div>
    </div>

    <h2>User Management</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="userTable">
            <tr>
                <td>1</td>
                <td>johndoe</td>
                <td>johndoe@example.com</td>
                <td>
                    <button class="btn btn-edit" onclick="editUser (1)">Edit</button>
                    <button class="btn btn-delete" onclick="deleteUser (1)">Delete</button>
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>janedoe</td>
                <td>janedoe@example.com</td>
                <td>
                    <button class="btn btn-edit" onclick="editUser (2)">Edit</button>
                    <button class="btn btn-delete" onclick="deleteUser (2)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function editUser (id) {
        alert("Edit user with ID: " + id);
    }

    function deleteUser (id) {
        if (confirm("Are you sure you want to delete user with ID: " + id + "?")) {
            const row = document.querySelector(`tr td:first-child:contains('${id}')`).parentNode;
            row.parentNode.removeChild(row);
        }
    }
</script>

</body>
</html>
